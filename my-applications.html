<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - LoanZap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-bank2 me-2"></i>LoanZap Portal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="apply-loan.html">Apply Loan</a></li>
                    <li class="nav-item"><a class="nav-link active" href="my-applications.html">My Applications</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Status Checker -->
        <div class="card p-4 mb-4">
            <h6 class="fw-bold text-info mb-3"><i class="bi bi-search me-1"></i> Quick PAN / NIC Status Lookup</h6>
            <form class="row g-2 align-items-end" onsubmit="handlePanStatusSearch(event)">
                <div class="col-md-5">
                    <label class="form-label small">NIC / PAN Card Number</label>
                    <input type="text" id="searchPan" class="form-control form-control-sm" placeholder="Enter ID" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Status Query</label>
                    <select id="searchStatus" class="form-select form-select-sm">
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success btn-sm w-100">Check Verification</button>
                </div>
            </form>
            <div id="searchOutput"></div>
        </div>

        <!-- History -->
        <div class="card p-0">
            <div class="p-3 border-bottom border-secondary">
                <h5 class="fw-bold mb-0">My Applications History</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>APP ID</th>
                            <th>FULL NAME</th>
                            <th>NIC / PAN</th>
                            <th>ANNUAL INCOME (LKR)</th>
                            <th>STATUS</th>
                            <th>DOB</th>
                        </tr>
                    </thead>
                    <tbody id="appsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/applications.js"></script>
</body>
</html>
