<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login -LoanZap| Bank Loan System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card auth-card border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-bank2 fs-1 text-primary"></i>
                            <h3 class="fw-bold mt-2">Bank Portal</h3>
                            <p class="text-muted small">Sign in to manage loans and applications</p>
                        </div>

                        <div id="alertContainer"></div>

                        <form onsubmit="handleLoginSubmit(event)">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <input type="text" id="userName" class="form-control" placeholder="Enter username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                            </div>
                            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
                        </form>

                        <div class="mt-4 pt-3 border-top text-center">
                            <p class="small text-muted mb-1">New Customer?</p>
                            <a href="register.html" class="btn btn-outline-primary btn-sm w-100 mb-2">Create Customer Account</a>
                            <a href="register-employee.html" class="text-decoration-none small text-secondary">Bank Employee Registration</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const user = getCurrentUser();
        if (user) {
            window.location.href = (user.role === USER_ROLES.BANK_EMPLOYEE || user.role === USER_ROLES.ADMIN)
                ? 'admin-dashboard.html'
                : 'dashboard.html';
        }
    </script>
</body>
</html>
