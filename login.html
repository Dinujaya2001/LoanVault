<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Loan System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">🏦 Bank Loan</h2>
                            <p class="text-muted">Sign in to your account</p>
                        </div>

                        <div id="alertBox"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control form-control-lg" 
                                       id="userName" required placeholder="Enter username">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control form-control-lg" 
                                       id="password" required placeholder="Enter password">
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Login
                            </button>
                        </form>

                        <hr class="my-4">
                        <div class="text-center">
                            <p class="mb-2">Don't have an account?</p>
                            <a href="register.html" class="btn btn-outline-primary btn-sm me-2">
                                Register as Customer
                            </a>
                            <a href="register.html?type=bank" class="btn btn-outline-secondary btn-sm">
                                Register as Bank Employee
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userName = document.getElementById('userName').value.trim();
            const password = document.getElementById('password').value;

            const res = await apiPost('/BankLoan/login', { userName, password });

            if (res.result) {
                setCurrentUser(res.data);
                showAlert('success', 'Login successful! Redirecting...');
                
                // Redirect based on role
                const role = (res.data.role || res.data.userType || '').toLowerCase();
                setTimeout(() => {
                    if (role.includes('bank') || role.includes('employee') || role.includes('admin')) {
                        window.location.href = 'bank-dashboard.html';
                    } else {
                        window.location.href = 'customer-dashboard.html';
                    }
                }, 800);
            } else {
                showAlert('danger', res.message || 'Invalid username or password');
            }
        });
    </script>
</body>
</html>
