<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanZap Officer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="admin-dashboard.html">
                <i class="bi bi-shield-check me-2"></i>LoanZap Officer Portal
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3 text-light small">
                        Officer: <strong id="empDisplay" class="text-white">Officer</strong>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0 text-white">Loan Applications Review</h3>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-info btn-sm active" id="btnAll" onclick="loadAllApplications()">All Applications</button>
                <button type="button" class="btn btn-outline-info btn-sm" id="btnAssigned" onclick="loadAssignedApplications()">Assigned To Me</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>APP ID</th>
                                <th>APPLICANT</th>
                                <th>PAN / NIC</th>
                                <th>EMPLOYMENT</th>
                                <th>CREDIT SCORE</th>
                                <th>INCOME (LKR)</th>
                                <th>STATUS</th>
                                <th class="text-center">ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

  
    <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="background:#08282c; color:#f0fdfa; border: 1px solid #0e3d42;">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold" id="modalTitle">Application Inspection</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="modalBody"></div>
                <div class="modal-footer border-top border-secondary d-flex justify-content-between">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Close</button>
                    <div class="gap-2 d-flex">
                        <button type="button" class="btn btn-danger btn-sm px-3" id="btnModalReject">
                            <i class="bi bi-x-circle me-1"></i>Reject
                        </button>
                        <button type="button" class="btn btn-success btn-sm px-3" id="btnModalApprove">
                            <i class="bi bi-check-circle me-1"></i>Approve
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
