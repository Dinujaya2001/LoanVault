<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Loan - Bank Loan System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="bi bi-bank2 me-2"></i>Bank Loan Portal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="apply-loan.html">Apply Loan</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-applications.html">My Applications</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-0 py-3">
                        <h4 class="fw-bold mb-0">Loan Application Form</h4>
                        <p class="text-muted small mb-0">All fields are mapped directly to the ApplicantLoanView schema</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertContainer"></div>

                        <form id="loanForm" onsubmit="submitLoanApplication(event)">
                            <h5 class="text-primary mb-3">1. Personal Information</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Full Legal Name *</label>
                                    <input type="text" id="fullName" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">PAN Card Number *</label>
                                    <input type="text" id="panCard" class="form-control" maxlength="10" placeholder="ABCDE1234F" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Date of Birth *</label>
                                    <input type="date" id="dateOfBirth" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Email *</label>
                                    <input type="email" id="email" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Phone *</label>
                                    <input type="tel" id="phone" class="form-control" pattern="[0-9]{10}" required>
                                </div>
                            </div>

                            <h5 class="text-primary mb-3">2. Residential Address</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Address Line *</label>
                                    <input type="text" id="address" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">City *</label>
                                    <input type="text" id="city" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">State *</label>
                                    <input type="text" id="state" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Zip Code *</label>
                                    <input type="text" id="zipCode" class="form-control" required>
                                </div>
                            </div>

                            <h5 class="text-primary mb-3">3. Financial & Employment Profile</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Annual Income ($) *</label>
                                    <input type="number" id="annualIncome" class="form-control" min="0" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Employment Status *</label>
                                    <select id="employmentStatus" class="form-select" required>
                                        <option value="Employed">Employed</option>
                                        <option value="Self-Employed">Self-Employed</option>
                                        <option value="Business">Business Owner</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold">Credit Score (300 - 850) *</label>
                                    <input type="number" id="creditScore" class="form-control" min="300" max="850" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-semibold">Declared Assets</label>
                                    <input type="text" id="assets" class="form-control" placeholder="e.g. Real Estate, Vehicle, Fixed Deposits">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                                <button type="submit" id="submitAppBtn" class="btn btn-primary px-4">Submit Application</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/loan.js"></script>
</body>
</html>
