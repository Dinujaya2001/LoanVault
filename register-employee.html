<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Employee Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
                            <h3 class="fw-bold mt-2">Bank User Sign Up</h3>
                            <p class="text-muted small">Register as an authorized bank employee</p>
                        </div>

                        <div id="alertContainer"></div>

                        <form id="empRegisterForm">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username *</label>
                                <input type="text" id="empUserName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Work Email *</label>
                                <input type="email" id="empEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Phone *</label>
                                <input type="tel" id="empPhone" class="form-control" pattern="[0-9]{10}" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Password *</label>
                                <input type="password" id="empPassword" class="form-control" minlength="6" required>
                            </div>
                            <button type="submit" id="empRegBtn" class="btn btn-primary w-100 py-2 fw-semibold">Create Employee Account</button>
                        </form>

                        <div class="mt-4 text-center">
                            <a href="index.html" class="small fw-semibold text-decoration-none">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('empRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('empRegBtn');
            const data = {
                userName: document.getElementById('empUserName').value.trim(),
                password: document.getElementById('empPassword').value,
                email: document.getElementById('empEmail').value.trim(),
                phone: document.getElementById('empPhone').value.trim(),
                role: USER_ROLES.BANK_EMPLOYEE
            };

            btn.disabled = true;
            btn.innerHTML = 'Registering...';

            const res = await BankLoanAPI.registerBankUser(data);
            btn.disabled = false;
            btn.innerHTML = 'Create Employee Account';

            if (res.result) {
                displayAlert('Employee registered successfully! Please login.', 'success');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                displayAlert(res.message || 'Registration failed.');
            }
        });
    </script>
</body>
</html>
