<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏦 Bank Loan</a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-3" id="userNameDisplay"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="alertBox"></div>

       
        <div class="card border-0 shadow-sm mb-4 bg-gradient-primary text-white">
            <div class="card-body p-4">
                <h3 class="fw-bold">Welcome back, <span id="welcomeName"></span>! 👋</h3>
                <p class="mb-0 opacity-75">Manage your loan applications here.</p>
            </div>
        </div>

        
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 stat-card" onclick="location.href='apply-loan.html'">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-file-earmark-plus display-4 text-primary"></i>
                        <h5 class="mt-3">Apply for Loan</h5>
                        <p class="text-muted small mb-0">Submit new application</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 stat-card" onclick="loadApplications()">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-list-check display-4 text-success"></i>
                        <h5 class="mt-3">My Applications</h5>
                        <p class="text-muted small mb-0">View all applications</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 stat-card" onclick="checkStatus()">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-search display-4 text-warning"></i>
                        <h5 class="mt-3">Check Status</h5>
                        <p class="text-muted small mb-0">By PAN card number</p>
                    </div>
                </div>
            </div>
        </div>

      
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">My Loan Applications</h5>
                <button class="btn btn-sm btn-primary" onclick="loadApplications()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body">
                <div id="applicationsList">
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-inbox display-4"></i>
                        <p class="mt-2">Loading applications...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const user = requireAuth();
        if (user) {
            document.getElementById('userNameDisplay').textContent = user.fullName || user.userName || 'User';
            document.getElementById('welcomeName').textContent = user.fullName || user.userName || 'User';
            loadApplications();
        }

        async function loadApplications() {
            const list = document.getElementById('applicationsList');
            const customerId = user.customerId || user.userId || user.id;

            const res = await apiGet(`/BankLoan/GetMyApplications?customerId=${customerId}`);

            if (res.result && res.data && res.data.length > 0) {
                list.innerHTML = `
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Full Name</th>
                                    <th>PAN</th>
                                    <th>Amount/Income</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${res.data.map((app, i) => `
                                    <tr>
                                        <td>${i + 1}</td>
                                        <td>${app.fullName || '-'}</td>
                                        <td><code>${app.panCard || '-'}</code></td>
                                        <td>${app.annualIncome ? '$' + Number(app.annualIncome).toLocaleString() : '-'}</td>
                                        <td>${statusBadge(app.status)}</td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary" 
                                                    onclick='viewDetails(${JSON.stringify(app)})'>
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } else {
                list.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-inbox display-4"></i>
                        <p class="mt-2">No applications found.</p>
                        <a href="apply-loan.html" class="btn btn-primary">Apply Now</a>
                    </div>`;
            }
        }

        function statusBadge(status) {
            const s = (status || 'Pending').toLowerCase();
            let cls = 'secondary';
            if (s.includes('approv')) cls = 'success';
            else if (s.includes('reject')) cls = 'danger';
            else if (s.includes('pending')) cls = 'warning';
            else if (s.includes('process')) cls = 'info';
            return `<span class="badge bg-${cls}">${status || 'Pending'}</span>`;
        }

        function viewDetails(app) {
            const html = `
                <div class="modal fade" id="detailModal">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header bg-primary text-white">
                                <h5 class="modal-title">Application Details</h5>
                                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    ${detailRow('Full Name', app.fullName)}
                                    ${detailRow('PAN Card', app.panCard)}
                                    ${detailRow('Email', app.email)}
                                    ${detailRow('Phone', app.phone)}
                                    ${detailRow('Date of Birth', app.dateOfBirth)}
                                    ${detailRow('Annual Income', app.annualIncome ? '$' + app.annualIncome : '-')}
                                    ${detailRow('Employment', app.employmentStatus)}
                                    ${detailRow('Credit Score', app.creditScore)}
                                    ${detailRow('Address', app.address)}
                                    ${detailRow('City', app.city)}
                                    ${detailRow('State', app.state)}
                                    ${detailRow('Zip Code', app.zipCode)}
                                    ${detailRow('Assets', app.assets)}
                                    ${detailRow('Status', app.status)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            
            
            const old = document.getElementById('detailModal');
            if (old) old.remove();
            
            document.body.insertAdjacentHTML('beforeend', html);
            new bootstrap.Modal(document.getElementById('detailModal')).show();
        }

        function detailRow(label, value) {
            return `<div class="col-md-6">
                <small class="text-muted d-block">${label}</small>
                <strong>${value || '-'}</strong>
            </div>`;
        }

        async function checkStatus() {
            const pan = prompt('Enter PAN Card Number:');
            if (!pan) return;
            const status = prompt('Enter Status (e.g., Pending, Approved):');
            if (!status) return;

            const res = await apiGet(`/BankLoan/CheckApplicationStatus?panCard=${pan}&status=${status}`);
            if (res.result) {
                alert('Status: ' + JSON.stringify(res.data, null, 2));
            } else {
                showAlert('danger', res.message || 'Not found');
            }
        }
    </script>
</body>
</html>
