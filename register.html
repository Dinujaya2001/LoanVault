<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bank Loan System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary" id="formTitle">Customer Registration</h2>
                        </div>

                        <div id="alertBox"></div>

                        
                        <ul class="nav nav-pills nav-fill mb-4">
                            <li class="nav-item">
                                <a class="nav-link active" href="#" onclick="switchRole('customer')">Customer</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#" onclick="switchRole('bank')">Bank Employee</a>
                            </li>
                        </ul>

                        <form id="registerForm">
                            <input type="hidden" id="roleType" value="customer">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="fullName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Username *</label>
                                    <input type="text" class="form-control" id="userName" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone *</label>
                                    <input type="tel" class="form-control" id="phone" 
                                           pattern="[0-9]{10}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password *</label>
                                <input type="password" class="form-control" id="password" 
                                       minlength="6" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" id="address">
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" class="form-control" id="city">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">State</label>
                                    <input type="text" class="form-control" id="state">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Zip Code</label>
                                    <input type="text" class="form-control" id="zipCode">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                Register
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="login.html">Already have an account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        
        const params = new URLSearchParams(window.location.search);
        if (params.get('type') === 'bank') {
            switchRole('bank');
        }

        function switchRole(role) {
            document.getElementById('roleType').value = role;
            document.querySelectorAll('.nav-pills .nav-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('formTitle').textContent = 
                role === 'bank' ? 'Bank Employee Registration' : 'Customer Registration';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('roleType').value;

            const payload = {
                fullName: document.getElementById('fullName').value,
                userName: document.getElementById('userName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zipCode: document.getElementById('zipCode').value
            };

            const endpoint = role === 'bank' 
                ? '/BankLoan/RegisterAsBankUser' 
                : '/BankLoan/RegisterCustomer';

            const res = await apiPost(endpoint, payload);

            if (res.result) {
                showAlert('success', 'Registration successful! Redirecting to login...');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                showAlert('danger', res.message || 'Registration failed');
            }
        });
    </script>
</body>
</html>
