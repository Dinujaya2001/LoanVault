<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Bank Loan Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-bank2 me-2"></i>LoanZap Portal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="apply-loan.html">Apply Loan</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-applications.html">My Applications</a></li>
                    <li class="nav-item ms-3">
                        <span class="text-white fw-bold me-2" id="navUser">Customer</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Welcome Header -->
        <div class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-1">Welcome, <span id="welcomeUser" class="text-info">Customer</span>! 👋</h3>
                    <p class="text-muted mb-0 small">Sri Lanka Banking Loan Management & Automated Status Tracker</p>
                </div>
                <a href="apply-loan.html" class="btn btn-success px-4 py-2 fw-semibold">
                    <i class="bi bi-plus-circle me-1"></i>Apply For New Loan
                </a>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <div class="text-muted small fw-semibold">Total Submissions</div>
                    <h2 class="fw-bold text-white mt-1 mb-0" id="statTotal">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <div class="text-muted small fw-semibold">Pending Review</div>
                    <h2 class="fw-bold text-warning mt-1 mb-0" id="statPending">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 h-100">
                    <div class="text-muted small fw-semibold">Approved Loans</div>
                    <h2 class="fw-bold text-success mt-1 mb-0" id="statApproved">0</h2>
                </div>
            </div>
        </div>

        <!-- Interactive Progress Charts Section -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card p-4 h-100">
                    <h6 class="fw-bold text-info mb-3"><i class="bi bi-pie-chart me-2"></i>Application Status Distribution</h6>
                    <div style="height: 250px; position: relative;">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4 h-100">
                    <h6 class="fw-bold text-info mb-3"><i class="bi bi-bar-chart me-2"></i>Loan Income Profile (LKR)</h6>
                    <div style="height: 250px; position: relative;">
                        <canvas id="incomeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
